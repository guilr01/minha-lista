<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lista Pronta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --tb:52px;
  --bg:#F6F3EC;--card:#FFFFFF;--line:#E4DED2;--line2:#EFEAE0;--field:#CFC7B8;
  --ink:#1B2430;--muted:#5A6472;
  --blue:#1F4F8F;--blue-d:#163A6B;--blue-l:#E3ECF7;--blue-xl:#F4F8FC;
  --yellow:#F4C542;
  --warn-bg:#FFF1D6;--warn:#7A4B00;--warn-line:#F1D9A6;
  --ok-bg:#E2F1E8;--ok:#2E7D4F;
  --red:#A33A2B;--purple-bg:#EDE6F7;--purple:#5B3A8C;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Figtree',system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;height:100%;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.h{font-family:'Bricolage Grotesque',Georgia,serif;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.strong{font-weight:700}
.block{display:block}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.warn-t{color:var(--warn)}
.ok-t{color:var(--ok)}

/* ---------- barra do protótipo ---------- */
.tb{height:var(--tb);flex:none;background:#10161F;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tb::-webkit-scrollbar{display:none}
.tb-brand{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
.tb-label{font-size:12px;color:#8C98A8}
.seg{display:flex;background:#222C3A;border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:none;color:#C9D1DB;padding:0 12px;height:32px;border-radius:8px;font-size:13px;font-weight:600}
.seg button:hover{color:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.tb-reset{margin-left:auto;flex:none;background:none;border:1px solid #3A4656;color:#C9D1DB;height:32px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600}
.tb-reset:hover{color:#fff;border-color:#5A6676}

/* ---------- palco ---------- */
#stage{flex:1;min-height:0;display:flex;justify-content:center}
#app{width:100%;height:100%;overflow:auto;background:var(--bg);position:relative;scroll-behavior:auto}
#stage.phone{background:#E3DDCF;padding:18px;align-items:center}
#stage.phone #app{width:390px;height:min(844px,100%);border-radius:34px;border:9px solid var(--ink);box-shadow:0 24px 60px rgba(27,36,48,.28)}
#app.is-desktop .d-root,#app.is-desktop .op-d{min-width:1024px}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;border:0;text-decoration:none}
.btn:hover{background:var(--blue-d)}
.btn:disabled{background:#AEB7C2;cursor:not-allowed}
.btn-block{width:100%}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px;border-radius:12px}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;background:#fff;color:var(--blue);border:1.5px solid var(--blue);font-weight:600;font-size:16px}
.btn2:hover{background:var(--blue-xl);color:var(--blue-d)}
.btn2.btn-sm{min-height:44px;font-size:15px;border-radius:12px}
.btn-ok{background:var(--ok)}.btn-ok:hover{background:#246540}
.link{background:none;border:0;padding:0;color:var(--blue);font-weight:600;min-height:32px;text-align:left}
.link:hover{color:var(--blue-d);text-decoration:underline}
.link.danger{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
.input{height:46px;border:1px solid var(--field);border-radius:10px;padding:0 12px;font-size:15px;font-weight:400;color:var(--ink);background:#fff;width:100%;min-width:0}
.input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.input-sm{height:44px;font-size:14px}
.input.is-err{border-color:var(--red);background:#FFF7F5}
.ta{height:112px;padding:10px 12px;resize:vertical;line-height:1.45}
.err-t{color:var(--red);font-size:12px;font-weight:600}
.req{color:var(--red)}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st-pago{background:var(--blue-l);color:var(--blue)}
.st-separacao{background:var(--warn-bg);color:var(--warn)}
.st-rota{background:var(--purple-bg);color:var(--purple)}
.st-entregue{background:var(--ok-bg);color:var(--ok)}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip-0{background:var(--blue-l);color:var(--blue)}.chip-1{background:var(--blue);color:#fff}.chip-2{background:var(--ink);color:var(--yellow)}.chip-m{background:var(--line2);color:var(--ink)}
.box-warn{padding:14px 16px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.box-warn strong{color:var(--ink)}
.box-info{padding:12px 14px;border-radius:12px;background:var(--blue-xl);border:1px dashed #B8C8DD;color:#2B3C52;font-size:13px;line-height:1.45}
.stk{display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--blue-l);border-top-color:var(--blue);animation:spin .9s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:inherit}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.logo-name{font-size:19px;font-weight:700}

/* ---------- área dos pais: celular ---------- */
.p-wrap{min-height:100%;display:flex;flex-direction:column}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:60px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;background:none;border:0;padding:0 4px 0 0;color:var(--blue);font-weight:600;font-size:15px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.dotc{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.p-main{flex:1;padding:4px 20px 28px}
.p-title{font-size:26px;line-height:1.15;font-weight:700}
.p-sub{margin-top:6px;font-size:15px;line-height:1.45;color:var(--muted)}
.p-body{margin-top:18px}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 20px 18px;display:flex;flex-direction:column;gap:10px;z-index:5}
.bar-total{display:flex;justify-content:space-between;align-items:baseline}
.bar-total .h{font-size:24px;font-weight:700}
.home-title{font-size:30px;line-height:1.12;font-weight:700}

/* ---------- área dos pais: desktop ---------- */
.d-root{min-height:100%;display:flex;flex-direction:column}
.d-head{background:#fff;border-bottom:1px solid var(--line);min-height:68px;display:flex;align-items:center;padding:0 40px;gap:24px;position:sticky;top:0;z-index:6}
.d-nav{margin-left:auto;display:flex;gap:6px}
.d-nav button{background:none;border:0;min-height:44px;padding:0 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink);display:flex;align-items:center;gap:8px}
.d-nav button:hover{background:var(--bg)}
.d-nav .cnt{min-width:22px;height:22px;border-radius:999px;background:var(--blue);color:#fff;font-size:12px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.stepper{display:flex;align-items:center;gap:10px;width:100%;max-width:1200px;margin:0 auto;padding:22px 40px 0}
.stp{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.stp .n{width:26px;height:26px;border-radius:999px;border:2px solid var(--field);display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff}
.stp.on{color:var(--ink)}.stp.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
.stp.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.stp-sep{flex:1;height:2px;background:var(--line);max-width:90px}
.d-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;width:100%;max-width:1200px;margin:0 auto;padding:24px 40px 64px;align-items:start}
.d-grid.full{grid-template-columns:minmax(0,1fr);max-width:880px}
.d-title{font-size:34px;line-height:1.1;font-weight:700}
.d-sub{margin-top:8px;font-size:16px;color:var(--muted);line-height:1.45}
.d-body{margin-top:22px}
.d-aside{position:sticky;top:92px}
.sum{padding:20px;display:flex;flex-direction:column;gap:12px}
.sum-t{font-size:18px;font-weight:700}
.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sum-row span:first-child{color:var(--muted)}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line2);padding-top:12px}
.sum-total .h{font-size:28px;font-weight:700}
.d-home{width:100%;max-width:1200px;margin:0 auto;padding:48px 40px 64px}
.d-home .hero{max-width:720px;margin-bottom:32px}
.d-home .home-title{font-size:46px;line-height:1.05}
.d-home .p-sub{font-size:18px;margin-top:12px}
.is-desktop .m-only{display:none}
.is-mobile .d-only{display:none}

/* ---------- telas dos pais ---------- */
.choices{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.is-desktop .choices{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.choice{padding:18px;display:flex;flex-direction:column;gap:12px}
.is-desktop .choice{padding:24px}
.choice h2{font-size:17px;font-weight:700}
.choice p{font-size:14px;line-height:1.4}
.choice-ic{width:44px;height:44px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:flex;align-items:center;justify-content:center}
.choice .btn,.choice .btn2{margin-top:auto}
.file-btn{position:relative;cursor:pointer}
.notice{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:14px;padding:12px 14px;border-radius:14px;background:var(--ok-bg);border:0;color:#1E5A38;font-size:15px;text-align:left;min-height:48px}
.help{text-align:center;font-size:14px;color:var(--muted);margin-top:22px}
.help .link{display:inline;min-height:0}

.src{padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.src-thumb{width:52px;height:64px;border-radius:8px;background:#FBFAF6;border:1px solid var(--line);padding:8px 7px;display:flex;flex-direction:column;gap:5px;flex:none;overflow:hidden}
.src-thumb i{display:block;height:3px;background:var(--field);border-radius:2px}
.src-thumb img{width:100%;height:100%;object-fit:cover;margin:-8px -7px;width:calc(100% + 14px);height:calc(100% + 16px)}
.lst{padding:2px 16px}
.lrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:flex-start}
.lrow:last-child{border-bottom:0}
.st{width:24px;height:24px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;font-weight:800;font-size:14px}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-warn{background:var(--warn-bg);color:var(--warn)}
.lrow-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lrow-txt strong{font-size:15px;font-weight:600}
.lrow-txt select{margin-top:8px}
.lrow-end{display:flex;flex-direction:column;align-items:flex-end;gap:0}
.qty{font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}

.tier{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line);color:var(--ink)}
.tier:hover{border-color:#9FB4CF}
.tier.on{border:2px solid var(--blue);padding:15px;background:var(--blue-xl)}
.tier-top{display:flex;align-items:center;gap:12px;width:100%}
.tier-top .h{margin-left:auto;font-size:24px;font-weight:700}
.dot{width:22px;height:22px;border-radius:999px;border:2px solid #9AA3AE;flex:none}
.tier.on .dot{border:7px solid var(--blue)}
.tier .ind{padding-left:34px;font-size:14px}
.is-desktop .tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.is-desktop .tier{padding:20px}
.is-desktop .tier.on{padding:19px}
.is-desktop .tier-top{flex-wrap:wrap}
.is-desktop .tier-top .h{margin-left:0;width:100%;font-size:30px;margin-top:6px}
.is-desktop .tier .ind{padding-left:0}

.item{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"info price" "tier qty";gap:10px 12px;align-items:center}
.is-desktop .item{grid-template-columns:minmax(0,1fr) 240px 136px 118px;grid-template-areas:"info tier qty price";padding:14px 18px}
.i-info{grid-area:info;display:flex;flex-direction:column;gap:2px;min-width:0}
.i-info strong{font-size:15px;font-weight:600}
.i-tier{grid-area:tier;min-width:0}
.i-qty{grid-area:qty;display:flex;align-items:center;gap:4px}
.i-qty span{min-width:32px;text-align:center;font-weight:700;font-size:16px}
.i-price{grid-area:price;display:flex;flex-direction:column;align-items:flex-end}
.i-price strong{font-size:15px;white-space:nowrap}
.qbtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--field);background:#fff;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center}
.qbtn:hover{background:#F1EDE4}
.qbtn:disabled{opacity:.4;cursor:not-allowed}
.removed{padding:0 14px;border:1px dashed var(--field);border-radius:16px;display:flex;justify-content:space-between;align-items:center;min-height:50px}
.removed span{text-decoration:line-through;color:var(--muted);font-size:14px}
.add-row{display:flex;gap:10px;align-items:center;margin-top:4px}

.sec{padding:16px;display:flex;flex-direction:column;gap:12px}
.is-desktop .sec{padding:22px}
.sec-t{font-size:16px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 12px;border:1px solid var(--field);border-radius:12px;background:#fff;cursor:pointer}
.opt.on{border:2px solid var(--blue);padding:9px 11px;background:var(--blue-xl)}
.opt input{width:18px;height:18px;accent-color:var(--blue);margin:0;flex:none}
.opt-txt{display:flex;flex-direction:column;font-size:15px;font-weight:600;line-height:1.25}
.opt-txt .small{font-weight:500}
.grid-addr{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px}

.pix{padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pix-amt{font-size:32px;font-weight:700}
.pix-code{display:flex;gap:8px;width:100%;max-width:420px}
.pix-code input{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.waiting{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}

.done-hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:12px 0 20px}
.done-ic{width:76px;height:76px;border-radius:999px;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center}
.tl{padding:18px}
.tl-row{display:flex;gap:14px}
.tl-col{display:flex;flex-direction:column;align-items:center}
.tl-dot{width:22px;height:22px;border-radius:999px;border:2px solid var(--field);background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.tl-dot.on{background:var(--ok);border-color:var(--ok)}
.tl-line{width:2px;flex:1;min-height:24px;background:var(--line)}
.tl-line.on{background:var(--ok)}
.tl-txt{display:flex;flex-direction:column;padding-bottom:14px}
.tl-txt strong{font-size:15px}
.ocard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;padding:16px;color:var(--ink)}
.ocard:hover{border-color:#9FB4CF}
.mini-list{padding:4px 16px}
.mini-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.mini-row:last-child{border-bottom:0}

/* ---------- painel do operador ---------- */
.op-d{display:flex;min-height:100%}
.op-side{width:240px;flex:none;background:var(--ink);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:flex-start;height:calc(100dvh - var(--tb) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#stage.phone .op-side{height:100%}
.op-side .logo{color:#fff;padding:0 8px 20px}
.nav{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:#D6DCE4;background:none;border:0;font-size:15px;font-weight:500;text-align:left;width:100%}
.nav:hover{background:#26364A;color:#fff}
.nav.on{background:var(--yellow);color:var(--ink);font-weight:700}
.badge{margin-left:auto;min-width:22px;height:22px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.nav.on .badge{background:var(--ink);color:var(--yellow)}
.op-foot{margin-top:auto;padding:12px;color:#9AA6B4;line-height:1.4;border-top:1px solid #2C3A4C}
.op-main{flex:1;padding:28px 32px 48px;min-width:0}
.op-m{min-height:100%}
.op-mh{background:var(--ink);padding:12px 16px;color:#fff}
.op-mh .logo{color:#fff}
.op-tabs{display:flex;gap:6px;padding:10px 12px;background:var(--ink);border-top:1px solid #2C3A4C;position:sticky;top:0;z-index:4;overflow-x:auto}
.op-tabs .nav{width:auto;flex:none;font-size:14px}
.op-mm{padding:18px 16px 40px}
.op-title{font-size:30px;font-weight:700}
.is-mobile .op-title{font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}
.is-mobile .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);text-align:left;color:var(--ink)}
.kpi:hover{border-color:#9FB4CF}
.kpi.on{border:2px solid var(--blue);padding:13px 15px}
.kpi .h{font-size:26px;font-weight:700}
.kpi.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}

  return { qty: Math.min(99, Math.max(1, qty || 1)), clean: s.trim() };

const ctaBtn = c => c ? `<button type="button" class="btn btn-block" data-action="${c.action}" ${c.arg ? `data-arg="${c.arg}"` : ''} ${c.disabled ? 'disabled' : ''}>${c.label}</button>` : '';
function layoutM(v) {
  const mine = S.orders.filter(o => o.mine).length;

function stepper(n) {

}
function summary(v) {

    <div class="sum-row"><span>Lista</span><span>${esc(d.source.label)}</span></div>

function layoutD(v) {

        <div class="grid2">${fld('Validade', 'val', { ph: 'MM/AA', im: 'numeric', mask: 'val' })}${fld('CVV', 'cvv', { ph: '123', im: 'numeric', mask: 'cvv' })}</div>
        <div class="box-info">Protótipo: nenhum dado é enviado. Qualquer número com 16 dígitos é aceito.</div></section>`,
      cta: { label: S.ui.processing ? 'Processando…' : `Pagar ${fmt(total())}`, action: 'payCard', disabled: S.ui.processing }, total: total() };
  },

  confirmado() {
    const o = order(S.ui.trackId);
    return { title: '', body: `<div class="done-hero"><div class="done-ic">${ic('check', 38, 2.6)}</div><h1 class="h p-title">Pedido #${o.id} confirmado</h1>
      <p class="muted" style="max-width:440px;line-height:1.45">Pagamento recebido. A lista ${o.student ? 'de ' + esc(o.student) + ' ' : ''}já está no painel da nossa equipe para separação.</p></div>
      <div class="stk">${timeline(o)}${pendNotes(o)}
      <button type="button" class="btn btn-block" data-action="openTrack" data-arg="${o.id}">Acompanhar pedido</button>
      <button type="button" class="btn2 btn-block" data-action="goHome">Fazer outra lista</button>
      <div class="box-info">Dica para a demonstração: abra o “Painel do operador” na barra de cima. O pedido #${o.id} já aparece lá.</div></div>` };
  },

  pedidos() {
    const mine = S.orders.filter(o => o.mine);
    return { back: 'home', title: 'Meus pedidos', sub: mine.length ? 'Toque em um pedido para ver o andamento.' : '',
      body: mine.length ? `<div class="stk">${mine.map(o => `<button type="button" class="card ocard" data-action="openTrack" data-arg="${o.id}">
        <span class="row-between"><strong style="font-size:16px">Pedido #${o.id}</strong><span class="pill st-${o.status}">${statusLabel(o)}</span></span>
        <span class="muted small">${esc(o.student)} · ${esc(o.school)} · ${rel(o.createdAt)}</span>
        <span class="row-between"><span class="small">${o.lines.length} itens · ${esc(o.tierLabel)}</span><strong>${fmt(o.subtotal + o.frete)}</strong></span>
        ${o.pending.some(p => p.status === 'aberto') || o.extras.some(x => !x.paid) ? `<span class="small warn-t strong">Tem item em análise ou cobrança pendente</span>` : ''}</button>`).join('')}</div>`
        : `<div class="card empty">Você ainda não fez nenhum pedido.<br><br><button type="button" class="btn btn-sm" data-action="goHome">Enviar minha lista</button></div>` };
  },

  pedido() {
    const o = order(S.ui.trackId);
    const items = o.lines.map(l => `<div class="mini-row"><span>${l.qty}× ${esc(l.name)} <span class="chip chip-${l.tier}" style="margin-left:6px">${TIERS[l.tier]}</span></span><span>${fmt(l.unit * l.qty)}</span></div>`).join('');
    return { back: 'pedidos', title: `Pedido #${o.id}`, sub: `${esc(o.student)} · ${esc(o.school)}`,
      body: `<div class="stk">${timeline(o)}${pendNotes(o)}${extrasBox(o, true)}
        <div class="card"><div style="padding:14px 16px 0" class="lbl">Itens</div><div class="mini-list">${items}
        <div class="mini-row"><span class="muted">Entrega</span><span>${o.frete ? fmt(o.frete) : 'Retirada · grátis'}</span></div>
        <div class="mini-row"><strong>Total pago</strong><strong>${fmt(o.subtotal + o.frete)}</strong></div></div></div>
        <div class="card info"><span class="lbl">Entrega</span><span>${esc(o.address)}</span><span class="muted">Pagamento: ${esc(o.pay)}</span></div></div>` };
  }
};

function timeline(o) {
  const idx = STATUS_ORDER.indexOf(o.status), ret = o.delivery === 'retirada';
  const steps = [['Pagamento confirmado', rel(o.createdAt)], ['Em separação', 'Nossa equipe monta o kit'], [ret ? 'Pronto para retirada' : 'Saiu para entrega', ret ? 'Avisamos pelo WhatsApp' : 'Você recebe um aviso'], [ret ? 'Retirado' : 'Entregue', ret ? 'Na loja' : 'Previsão: [prazo de entrega]']];
  return `<div class="card tl" aria-label="Andamento do pedido">${steps.map((s, i) => `<div class="tl-row"><div class="tl-col"><span class="tl-dot ${i <= idx ? 'on' : ''}">${i <= idx ? ic('check', 12, 3.5) : ''}</span>${i < 3 ? `<span class="tl-line ${i < idx ? 'on' : ''}"></span>` : ''}</div><div class="tl-txt"><strong style="${i > idx ? 'color:var(--muted);font-weight:600' : ''}">${s[0]}</strong><span class="small muted">${s[1]}</span></div></div>`).join('')}</div>`;
}
function pendNotes(o) {
  return o.pending.map(p => p.status === 'aberto'
    ? `<div class="box-warn"><strong>!</strong><span><strong>${esc(p.raw)}</strong> está em análise pela nossa equipe. Avisamos pelo WhatsApp se ele entra no pedido.</span></div>`
    : p.status === 'resolvido'
      ? `<div class="box-info"><strong>${esc(p.raw)}</strong>: ${esc(p.note)}. Valor cobrado à parte (veja abaixo).</div>`
      : `<div class="box-info"><strong>${esc(p.raw)}</strong>: ${esc(p.note)}</div>`).join('');
}
function extrasBox(o, parent) {
  if (!o.extras.length) return '';
  return `<div class="card info"><span class="lbl">Cobrança complementar</span>${o.extras.map((x, i) => `<div class="row-between"><span>${esc(x.desc)}</span><span class="row-between" style="gap:10px;flex:none"><strong style="white-space:nowrap">${fmt(x.value)}</strong>${x.paid ? '<span class="pill st-entregue">Pago</span>' : parent ? `<button type="button" class="btn btn-sm" data-action="payExtra" data-arg="${o.id}:${i}">Pagar com Pix</button>` : '<span class="pill st-separacao">Aguardando</span>'}</span></div>`).join('')}</div>`;
}
function qr(seed) {
  let x = 0; for (const c of String(seed || 'x')) x = (x * 31 + c.charCodeAt(0)) & 0x7fffffff;
  const rnd = () => { x = (x * 1103515245 + 12345) & 0x7fffffff; return x / 0x7fffffff; };
  const n = 25, F = [[0, 0], [0, n - 7], [n - 7, 0]];
  const inF = (i, j) => F.some(([a, b]) => i >= a - 1 && i <= a + 7 && j >= b - 1 && j <= b + 7);
  let r = '';
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (!inF(i, j) && rnd() > .52) r += `<rect x="${j}" y="${i}" width="1" height="1"/>`;
  const f = F.map(([a, b]) => `<rect x="${b}" y="${a}" width="7" height="7" fill="#1B2430"/><rect x="${b + 1}" y="${a + 1}" width="5" height="5" fill="#fff"/><rect x="${b + 2}" y="${a + 2}" width="3" height="3" fill="#1B2430"/>`).join('');
  return `<svg viewBox="-2 -2 29 29" width="196" height="196" role="img" aria-label="QR Code Pix de exemplo" style="border:1px solid var(--line);border-radius:12px"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g fill="#1B2430">${r}</g>${f}</svg>`;
}

/* =========================================================
   PAINEL DO OPERADOR
   ========================================================= */
function renderOp() {
  const isD = effView() === 'desktop', scr = S.ui.opScreen, openN = openPend().length;
  const body = scr === 'pedido' && order(S.ui.opOrder) ? opPedido(isD) : scr === 'pendencias' ? opPend(isD) : scr === 'catalogo' ? opCat(isD) : opPedidos(isD);
  const active = scr === 'pedido' ? 'pedidos' : scr;
  const items = [['pedidos', 'Pedidos', 'list', 'Pedidos'], ['pendencias', 'Itens não encontrados', 'alert', 'Pendências'], ['catalogo', 'Catálogo e faixas', 'tag', 'Catálogo']];
  const navB = (k, t, icon, short, full) => `<button type="button" class="nav ${active === k ? 'on' : ''}" data-action="opNav" data-arg="${k}" ${active === k ? 'aria-current="page"' : ''}>${full ? ic(icon, 18) : ''}${full ? t : short}${k === 'pendencias' && openN ? `<span class="badge">${openN}</span>` : ''}</button>`;
  if (isD) return `<div class="op-d"><nav class="op-side" aria-label="Painel">${logo('noop')}${items.map(i => navB(...i, true)).join('')}<div class="op-foot small">Pedidos pagos na Área dos pais chegam aqui na hora, já formatados.</div></nav><main class="op-main">${body}</main></div>`;
  return `<div class="op-m"><div class="op-mh">${logo('noop')}</div><nav class="op-tabs" aria-label="Painel">${items.map(i => navB(...i, false)).join('')}</nav><main class="op-mm">${body}</main></div>`;
}

function opPedidos(isD) {
  const c = s => S.orders.filter(o => o.status === s).length, f = S.ui.opFilter, openN = openPend().length;
  const kpi = (v, t, n, warn) => `<button type="button" class="kpi ${warn ? 'warn' : ''} ${f === v ? 'on' : ''}" data-action="${warn ? 'opNav' : 'opFilter'}" data-arg="${warn ? 'pendencias' : v}"><span class="small ${warn ? 'warn-t' : 'muted'} strong">${t}</span><span class="h">${n}</span></button>`;
  const list = S.orders.filter(o => f === 'todos' || o.status === f).sort((a, b) => b.createdAt.localeCompare(a.createdAt));
  const tab = (v, t) => `<button type="button" data-action="opFilter" data-arg="${v}" aria-pressed="${f === v}">${t}</button>`;
  const pn = o => { const n = o.pending.filter(p => p.status === 'aberto').length; return n ? `${n} ${n > 1 ? 'itens' : 'item'} em análise` : ''; };
  const rows = isD
    ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Pedido</th><th>Responsável</th><th>Escola · série</th><th>Faixa</th><th>Itens</th><th>Total</th><th>Status</th><th>Pendência</th></tr></thead><tbody>
      ${list.map(o => `<tr data-action="openOrder" data-arg="${o.id}"><td><button type="button" class="link strong" data-action="openOrder" data-arg="${o.id}">#${o.id}</button><span class="small muted block">${rel(o.createdAt)}${o.mine ? ' · novo' : ''}</span></td><td>${esc(o.parent)}</td><td class="muted">${esc(o.school)}</td><td><span class="chip ${o.tierLabel === 'Mista' ? 'chip-m' : 'chip-' + TIERS.indexOf(o.tierLabel)}">${esc(o.tierLabel)}</span></td><td>${o.lines.length}</td><td class="strong">${fmt(o.subtotal + o.frete)}</td><td><span class="pill st-${o.status}">${statusLabel(o)}</span></td><td class="small warn-t strong">${pn(o) || '<span class="muted">—</span>'}</td></tr>`).join('')}
      </tbody></table>${list.length ? '' : '<div class="empty">Nenhum pedido neste filtro.</div>'}</div>`
    : `<div class="stk">${list.map(o => `<button type="button" class="card ocard" data-action="openOrder" data-arg="${o.id}"><span class="row-between"><strong>#${o.id} · ${esc(o.parent)}</strong><span class="pill st-${o.status}">${statusLabel(o)}</span></span><span class="small muted">${esc(o.school)} · ${rel(o.createdAt)}</span><span class="row-between small"><span>${o.lines.length} itens · ${esc(o.tierLabel)}</span><strong>${fmt(o.subtotal + o.frete)}</strong></span>${pn(o) ? `<span class="small warn-t strong">${pn(o)}</span>` : ''}</button>`).join('') || '<div class="card empty">Nenhum pedido neste filtro.</div>'}</div>`;
  return `<div class="op-head"><h1 class="h op-title">Pedidos</h1><span class="small muted">${S.orders.length} pedidos no total</span></div>
    <div class="kpis">${kpi('pago', 'Pagos, a separar', c('pago'))}${kpi('separacao', 'Em separação', c('separacao'))}${kpi('rota', 'Saiu para entrega', c('rota'))}${kpi('entregue', 'Entregues', c('entregue'))}${kpi('', 'Itens em análise', openN, true)}</div>
    <div class="tabs" role="group" aria-label="Filtro">${tab('todos', 'Todos')}${tab('pago', 'Pagos')}${tab('separacao', 'Em separação')}${tab('rota', 'Em entrega')}${tab('entregue', 'Entregues')}</div>${rows}`;
}

function opPedido(isD) {
  const o = order(S.ui.opOrder), ret = o.delivery === 'retirada';
  const next = { pago: ['separacao', 'Iniciar separação'], separacao: ['rota', ret ? 'Marcar pronto para retirada' : 'Marcar como saiu para entrega'], rota: ['entregue', ret ? 'Confirmar retirada' : 'Confirmar entrega'] }[o.status];
  const done = o.lines.filter(l => l.done).length;
  const checks = o.lines.map((l, i) => `<label class="chk ${l.done ? 'done' : ''}"><input type="checkbox" data-action="toggleDone" data-arg="${o.id}:${i}" ${l.done ? 'checked' : ''}><span class="nm">${esc(l.name)}${l.added ? ' <span class="small ok-t strong">· incluído depois</span>' : ''}</span><span class="chip chip-${l.tier}">${TIERS[l.tier]}</span><span class="q">${l.qty}</span></label>`).join('');
  const diffs = o.lines.filter(l => !l.added && l.qty !== l.baseQty).map(l => `<span>${esc(l.name)}: lista pede ${l.baseQty}, pais pediram ${l.qty}</span>`);
  const att = [
    ...o.removed.map(n => `<span>Removido pelos pais: ${esc(n)}</span>`), ...diffs,
    ...o.pending.filter(p => p.status === 'aberto').map(p => `<span>Em análise: ${esc(p.raw)} · <button type="button" class="link" style="min-height:0;display:inline" data-action="openPend" data-arg="${o.id}:${p.uid}">resolver</button></span>`),
    ...o.pending.filter(p => p.status !== 'aberto').map(p => `<span>${esc(p.raw)}: ${esc(p.note)}</span>`)
  ];
  return `<button type="button" class="back" data-action="opNav" data-arg="pedidos">${ic('back')}Pedidos</button>
    <div class="op-head"><div style="display:flex;flex-direction:column;gap:6px"><h1 class="h op-title">Pedido #${o.id} · lista de separação</h1><span><span class="pill st-${o.status}">${statusLabel(o)}</span> <span class="small muted">&nbsp;${rel(o.createdAt)}</span></span></div>
    <div class="op-actions">${next ? `<button type="button" class="btn btn-sm ${o.status === 'rota' ? 'btn-ok' : ''}" data-action="advance" data-arg="${o.id}">${next[1]}</button>` : ''}</div></div>
    <div class="op-grid">
      <div class="card" style="overflow:hidden"><div style="padding:14px 18px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)"><div class="row-between"><span class="strong">${done} de ${o.lines.length} itens separados</span><span class="small muted">Marque conforme pega na prateleira</span></div><div class="prog"><i style="width:${o.lines.length ? done / o.lines.length * 100 : 0}%"></i></div></div>
      ${checks}
      ${o.status === 'pago' && done > 0 ? '' : ''}
      </div>
      <div class="stk">
        <div class="card info"><span class="lbl">Aluno e entrega</span><strong style="font-size:16px">${esc(o.student)}</strong><span class="muted">${esc(o.school)}</span><span>Responsável: ${esc(o.parent)}</span><span>WhatsApp: ${esc(o.phone)}</span><span>${ret ? ic('store', 16) + ' ' : ''}${esc(o.address)}</span></div>
        <div class="card info"><span class="lbl">Pagamento</span><span class="ok-t strong">${esc(o.pay)} · pago</span><span class="row-between"><span class="muted">Produtos</span><span>${fmt(o.subtotal)}</span></span><span class="row-between"><span class="muted">Entrega</span><span>${o.frete ? fmt(o.frete) : 'Retirada'}</span></span><span class="row-between"><strong>Total</strong><strong>${fmt(o.subtotal + o.frete)}</strong></span></div>
        ${att.length ? `<div class="box-warn" style="flex-direction:column;gap:6px"><strong>Atenção neste pedido</strong>${att.join('')}</div>` : ''}
        ${extrasBox(o, false)}
      </div>
    </div>`;
}

function opPend(isD) {
  const q = openPend();
  if (!S.ui.pendSel || !q.find(x => x.o.id + ':' + x.p.uid === S.ui.pendSel)) { S.ui.pendSel = q[0] ? q[0].o.id + ':' + q[0].p.uid : null; S.ui.pend = null; }
  const hist = S.orders.flatMap(o => o.pending.filter(p => p.status !== 'aberto').map(p => ({ o, p }))).slice(0, 6);
  const histH = hist.length ? `<div class="lbl" style="margin-top:18px">Resolvidos</div><div class="hist">${hist.map(({ o, p }) => `<div class="hist-row"><strong>${esc(p.raw)}</strong><span class="muted">#${o.id} · ${esc(p.note)}</span></div>`).join('')}</div>` : '';
  const head = `<h1 class="h op-title">Itens não encontrados</h1><p class="muted" style="margin-top:4px">Linhas das listas que o sistema não conseguiu ligar a um item do catálogo. Ao resolver, o sistema aprende para as próximas listas.</p>`;
  if (!q.length) return `${head}<div class="card empty" style="margin-top:18px">Tudo resolvido. Nenhum item aguardando análise.</div>${histH}`;
  const cur = q.find(x => x.o.id + ':' + x.p.uid === S.ui.pendSel), { o, p } = cur;
  if (!S.ui.pend) S.ui.pend = { mode: 'novo', itemId: '', tier: String(tierIdx(o)), name: p.raw.charAt(0).toUpperCase() + p.raw.slice(1), p0: '', p1: '', p2: '', msg: 'Não trabalhamos com este item. Recomendamos adquiri-lo separadamente.' };
  const U = S.ui.pend;
  const qList = q.map(({ o, p }) => { const k = o.id + ':' + p.uid; return `<button type="button" class="pq ${k === S.ui.pendSel ? 'on' : ''}" aria-pressed="${k === S.ui.pendSel}" data-action="pendSelect" data-arg="${k}"><strong>${esc(p.raw)}</strong><span class="small muted">Pedido #${o.id} · ${esc(o.school)} · qtd ${p.qty}</span></button>`; }).join('');
  const radio = (v, t) => `<label class="radio"><input type="radio" name="pmode" value="${v}" data-action="pendMode" ${U.mode === v ? 'checked' : ''}>${t}</label>`;
  const tierSel = `<label class="field">Faixa cobrada<select class="input" data-field="ui.pend.tier">${TIERS.map((n, i) => `<option value="${i}" ${String(i) === U.tier ? 'selected' : ''}>${n}</option>`).join('')}</select></label>`;
  let form = '';
  if (U.mode === 'link') form = `<div class="grid2"><label class="field">Item do catálogo<select class="input" data-field="ui.pend.itemId"><option value="">Escolha…</option>${S.catalog.map(c => `<option value="${c.id}" ${c.id === U.itemId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>${tierSel}</div>`;
  if (U.mode === 'novo') form = `<div class="p3"><label class="field">Nome do item<input class="input" data-field="ui.pend.name" value="${esc(U.name)}"></label>${[0, 1, 2].map(i => `<label class="field"><span class="chip chip-${i}">${TIERS[i]}</span><input class="input money" inputmode="decimal" placeholder="R$ 0,00" data-field="ui.pend.p${i}" value="${esc(U['p' + i])}"></label>`).join('')}</div><div style="max-width:280px">${tierSel}</div>`;
  if (U.mode === 'nao') form = `<label class="field">Mensagem para os pais (WhatsApp)<textarea class="input ta" data-field="ui.pend.msg">${esc(U.msg)}</textarea></label>`;
  const btn = U.mode === 'nao' ? 'Avisar os pais' : 'Salvar e gerar cobrança';
  return `${head}<div class="pend-grid"><div class="stk">${qList}${isD ? histH : ''}</div>
    <div class="card pd">
      <div class="pd-top"><div class="quote"><span class="lbl">Texto na lista</span><span class="q">“${esc(p.raw)}”</span></div>
      <div class="info" style="padding:0"><span class="lbl">Pedido</span><strong>#${o.id} · ${esc(o.student)}</strong><span class="muted">${esc(o.school)} · quantidade ${p.qty}</span><span class="muted">Responsável: ${esc(o.parent)} · ${esc(o.phone)}</span><span class="muted">Os pais já pagaram o restante do pedido.</span></div></div>
      <div style="height:1px;background:var(--line2)"></div>
      <div><span class="strong" style="font-size:16px">Como resolver?</span>${radio('link', 'Ligar a um item que já existe no catálogo')}${radio('novo', 'Cadastrar um item novo com as 3 faixas')}${radio('nao', 'Não vendemos: avisar os pais')}</div>
      ${form}
      <div class="row-between" style="flex-wrap:wrap"><span class="small muted">${U.mode === 'nao' ? 'O item sai do pedido e os pais recebem a mensagem.' : 'O item entra na lista de separação e os pais recebem a cobrança do valor. Da próxima vez, esse texto é reconhecido sozinho.'}</span><button type="button" class="btn btn-sm" data-action="resolve">${btn}</button></div>
    </div></div>${isD ? '' : histH}`;
}

function opCat(isD) {
  const al = id => Object.keys(S.aliases).filter(k => S.aliases[k] === id).map(k => `<span class="alias" title="Aprendido com uma lista">${esc(k)}</span>`).join('');
  const inp = (c, i) => `<input class="input input-sm money" aria-label="Preço ${TIERS[i]} de ${esc(c.name)}" inputmode="decimal" data-price="${c.id}:${i}" value="${c.p[i].toFixed(2).replace('.', ',')}">`;
  const rows = isD
    ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Item genérico</th><th style="width:130px">Econômica</th><th style="width:130px">Intermediária</th><th style="width:130px">Premium</th><th>Também reconhece</th></tr></thead><tbody>
      ${S.catalog.map(c => `<tr data-name="${esc(norm(c.name))}"><td class="strong">${esc(c.name)}${c.custom ? ' <span class="small ok-t">· novo</span>' : ''}</td><td>${inp(c, 0)}</td><td>${inp(c, 1)}</td><td>${inp(c, 2)}</td><td>${al(c.id) || '<span class="muted small">—</span>'}</td></tr>`).join('')}</tbody></table></div>`
    : `<div class="stk">${S.catalog.map(c => `<div class="card ccard" data-name="${esc(norm(c.name))}"><strong>${esc(c.name)}</strong><div class="grid3">${[0, 1, 2].map(i => `<label class="field"><span class="chip chip-${i}" style="font-size:11px">${TIERS[i]}</span>${inp(c, i)}</label>`).join('')}</div>${al(c.id) ? `<div>${al(c.id)}</div>` : ''}</div>`).join('')}</div>`;
  return `<h1 class="h op-title">Catálogo e faixas</h1><p class="muted" style="margin-top:4px">Cada item genérico tem um preço por faixa. Alterações valem para as próximas listas.</p>
    <div class="cat-search"><label class="sr" for="catq">Buscar item</label><input id="catq" class="input" placeholder="Buscar item…" data-filter="1"></div>${rows}`;
}

   AÇÕES
   ========================================================= */
function findLine(uidv) { return lines().find(l => l.uid === uidv); }
function validateCheckout() {
  const d = S.draft, f = d.form, e = {};
  if (!f.aluno.trim()) e.aluno = 'Informe o nome do aluno';
  if (!f.resp.trim()) e.resp = 'Informe seu nome';
  if (digits(f.fone).length < 10) e.fone = 'WhatsApp com DDD';
  if (d.delivery === 'entrega') {
    if (digits(f.cep).length !== 8) e.cep = 'CEP com 8 dígitos';
    if (!f.end.trim()) e.end = 'Informe o endereço';
    if (!f.num.trim()) e.num = 'Informe o número';
  }
  d.errors = e; return !Object.keys(e).length;
}
const A = {
  noop() {},
  mode(el) { S.ui.mode = el.dataset.v; render(); $('#app').scrollTop = 0; },
  view(el) { S.ui.view = el.dataset.v; render(); },
  reset() { S = fresh(); PHOTO = null; LENDO = null; render(); toast('Demo reiniciada'); },
  go(el) { nav(el.dataset.arg); },
  goHome() { S.ui.mode = 'pais'; nav('home'); },
  whats() { toast('Aqui abriria a conversa no WhatsApp da loja'); },
  schoolChange(el) { S.ui.school = el.value; S.ui.grade = Object.keys(SCHOOLS[el.value].grades)[0]; render(); },
  gradeChange(el) { S.ui.grade = el.value; },
  loadSchool() { const sc = SCHOOLS[S.ui.school], g = sc.grades[S.ui.grade]; PHOTO = null; newDraft(`${sc.name} · ${g.label.split(' · ')[0]}`, g.text); nav('leitura'); },
  fillSample() { S.ui.paste = SAMPLE_PASTE; render(); },
  parsePaste() {
    const t = (S.ui.paste || '').trim();
    if (!parseList(t).length) { toast('Cole a lista com um item por linha'); return; }
    PHOTO = null; newDraft('Lista colada', t); nav('leitura');
  },
  upload(el) {
    const f = el.files && el.files[0]; if (!f) return;
    PHOTO = null;
    const go = () => { LENDO = setTimeout(() => { LENDO = null; newDraft('Foto enviada', SCHOOLS.modelo.grades['3'].text, true); nav('leitura'); }, 1800); nav('lendo'); };
    if (f.type.startsWith('image/')) { const r = new FileReader(); r.onload = () => { PHOTO = r.result; go(); }; r.onerror = go; r.readAsDataURL(f); } else go();
  },
  editLine(el) { S.ui.editLine = S.ui.editLine === el.dataset.uid ? null : el.dataset.uid; render(); },
  relink(el) { const l = findLine(el.dataset.uid); l.itemId = el.value || null; l.tier = S.draft.tier; S.ui.editLine = null; render(); },
  setTier(el) { const t = +el.dataset.arg; S.draft.tier = t; lines().forEach(l => l.tier = t); render(); },
  lineTier(el) { findLine(el.dataset.uid).tier = +el.value; render(); },
  inc(el) { const l = findLine(el.dataset.uid); l.qty = Math.min(99, l.qty + 1); render(); },
  dec(el) { const l = findLine(el.dataset.uid); l.qty = Math.max(1, l.qty - 1); render(); },
  remove(el) { findLine(el.dataset.uid).removed = true; render(); },
  undo(el) { findLine(el.dataset.uid).removed = false; render(); },
  addItem() {
    const v = $('#addSel').value; if (!v) { toast('Escolha um item para adicionar'); return; }
    const c = cat(v); S.draft.lines.push({ uid: uid(), raw: c.name, clean: c.name, qty: 1, baseQty: 0, itemId: v, tier: S.draft.tier, removed: false });
    render(); toast(c.name + ' adicionado');
  },
  delivery(el) { S.draft.delivery = el.value; render(); },
  pay(el) { S.draft.pay = el.value; render(); },
  parcelas(el) { S.draft.parcelas = el.value; },
  toPayment() {
    if (!validateCheckout()) { render(); toast('Preencha os campos destacados'); const e = $('.is-err'); if (e) e.focus(); return; }
    const d = S.draft;
    if (d.pay === 'pix') { d.pixCode = '00020126580014BR.GOV.BCB.PIX0136' + Math.random().toString(16).slice(2, 10) + '-exemplo-' + Math.random().toString(16).slice(2, 10) + '5204000053039865406' + total().toFixed(2) + '5802BR6304' + Math.random().toString(16).slice(2, 6).toUpperCase(); nav('pix'); }
    else nav('cartao');
  },
  copyPix() { const t = S.draft.pixCode; try { navigator.clipboard.writeText(t).then(() => toast('Código Pix copiado'), () => toast('Selecione e copie o código')); } catch (e) { toast('Selecione e copie o código'); } },
  confirmPix() { finishOrder('Pix'); },
  payCard() {
    const c = S.draft.card, e = {};
    if (digits(c.num).length !== 16) e.c_num = 'Número com 16 dígitos';
    if (!c.nome.trim()) e.c_nome = 'Nome como no cartão';
    if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(c.val)) e.c_val = 'Use MM/AA';
    if (digits(c.cvv).length < 3) e.c_cvv = '3 ou 4 dígitos';
    S.draft.errors = e;
    if (Object.keys(e).length) { render(); toast('Confira os dados do cartão'); return; }
    S.ui.processing = true; render();
    setTimeout(() => finishOrder('Cartão ' + S.draft.parcelas + 'x'), 1300);
  },
  openTrack(el) { S.ui.trackId = +el.dataset.arg; nav('pedido'); },
  payExtra(el) { const [id, i] = el.dataset.arg.split(':'); order(id).extras[+i].paid = true; render(); toast('Pagamento complementar confirmado (simulação)'); },

  opNav(el) { opNav(el.dataset.arg); },
  opFilter(el) { S.ui.opFilter = el.dataset.arg || 'todos'; S.ui.opScreen = 'pedidos'; render(); },
  openOrder(el) { S.ui.opOrder = +el.dataset.arg; opNav('pedido'); },
  toggleDone(el) { const [id, i] = el.dataset.arg.split(':'); const o = order(id); o.lines[+i].done = el.checked; if (el.checked && o.status === 'pago') { o.status = 'separacao'; toast('Pedido passou para “Em separação”'); } render(); },
  advance(el) {
    const o = order(el.dataset.arg), i = STATUS_ORDER.indexOf(o.status);
    if (o.status === 'separacao' && o.lines.some(l => !l.done)) { toast('Marque todos os itens como separados antes'); return; }
    if (o.status === 'separacao' && o.pending.some(p => p.status === 'aberto')) { toast('Há item em análise: resolva em “Itens não encontrados”'); return; }
    if (i < 3) { o.status = STATUS_ORDER[i + 1]; if (o.status === 'rota' || o.status === 'entregue') o.lines.forEach(l => l.done = true); }
    render(); toast(`#${o.id}: ${statusLabel(o)}. Os pais foram avisados pelo WhatsApp (simulação)`);
  },
  printOrder(el) {
    const o = order(el.dataset.arg);
    $('#print-area').innerHTML = `<h1>Pedido #${o.id} · ${esc(o.student)}</h1><div>${esc(o.school)} · ${esc(o.tierLabel)} · ${esc(o.pay)}</div>
      <table><thead><tr><th>OK</th><th>Produto</th><th>Faixa</th><th>Qtd</th></tr></thead><tbody>${o.lines.map(l => `<tr><td>☐</td><td>${esc(l.name)}</td><td>${TIERS[l.tier]}</td><td><b>${l.qty}</b></td></tr>`).join('')}</tbody></table>
      <div class="lab"><b>${esc(o.student)}</b><br>${esc(o.school)}<br>Resp.: ${esc(o.parent)} · ${esc(o.phone)}<br>${esc(o.address)}<br>Pedido #${o.id}</div>`;
    window.print();
  },
  openPend(el) { S.ui.pendSel = el.dataset.arg; S.ui.pend = null; opNav('pendencias'); },
  pendSelect(el) { S.ui.pendSel = el.dataset.arg; S.ui.pend = null; render(); },
  pendMode(el) { S.ui.pend.mode = el.value; render(); },
  resolve() {
    const cur = openPend().find(x => x.o.id + ':' + x.p.uid === S.ui.pendSel); if (!cur) return;
    const { o, p } = cur, U = S.ui.pend;
    const learn = id => { const k = norm(p.raw).trim(); if (k) S.aliases[k] = id; };
    const add = (id, tier) => {
      const it = cat(id), unit = it.p[tier];
      o.lines.push({ itemId: id, name: it.name, tier, qty: p.qty, baseQty: p.qty, unit, done: false, added: true });
      o.extras.push({ desc: `${it.name} × ${p.qty}`, value: unit * p.qty, paid: false });
      p.status = 'resolvido'; p.note = `incluído como ${it.name} (${TIERS[tier]})`;
      learn(id);
    };
    if (U.mode === 'link') { if (!U.itemId) { toast('Escolha o item do catálogo'); return; } add(U.itemId, +U.tier); }
    else if (U.mode === 'novo') {
      const name = U.name.trim(), pr = [U.p0, U.p1, U.p2].map(money);
      if (!name || pr.some(v => !(v > 0))) { toast('Preencha o nome e os 3 preços'); return; }
      const id = 'novo-' + Date.now(); S.catalog.push({ id, name, req: [], bonus: [], p: pr, custom: true }); add(id, +U.tier);
    } else { p.status = 'nao'; p.note = U.msg.trim() || 'Item não disponível'; }
    S.ui.pendSel = null; S.ui.pend = null; render();
    toast(U.mode === 'nao' ? 'Pais avisados pelo WhatsApp (simulação)' : 'Item incluído e cobrança enviada aos pais (simulação)');
  }
};

/* máscaras */
const MASK = {
  phone: v => { const d = digits(v).slice(0, 11); if (d.length <= 2) return d.length ? '(' + d : ''; if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`; if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`; return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`; },
  cep: v => { const d = digits(v).slice(0, 8); return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d; },
  card: v => digits(v).slice(0, 16).replace(/(\d{4})(?=\d)/g, '$1 '),
  val: v => { const d = digits(v).slice(0, 4); return d.length > 2 ? d.slice(0, 2) + '/' + d.slice(2) : d; },
  cvv: v => digits(v).slice(0, 4)
};
function setPath(path, val) { const ks = path.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  if (['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName)) return;
  const f = A[el.dataset.action]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.price) { const [id, i] = el.dataset.price.split(':'); const v = money(el.value); if (v > 0) { cat(id).p[+i] = v; save(); el.value = v.toFixed(2).replace('.', ','); toast('Preço atualizado'); } else { el.value = cat(id).p[+i].toFixed(2).replace('.', ','); } return; }
  if (el.dataset.field && el.tagName === 'SELECT') { setPath(el.dataset.field, el.value); save(); return; }
  if (el.dataset.action && ['INPUT', 'SELECT'].includes(el.tagName)) { const f = A[el.dataset.action]; if (f) f(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.filter) { const q = norm(el.value).trim(); document.querySelectorAll('[data-name]').forEach(r => { r.style.display = !q || r.dataset.name.includes(q) ? '' : 'none'; }); return; }
  if (!el.dataset.field || el.tagName === 'SELECT') return;
  if (el.dataset.mask && MASK[el.dataset.mask]) el.value = MASK[el.dataset.mask](el.value);
  setPath(el.dataset.field, el.value);
  if (el.classList.contains('is-err')) { el.classList.remove('is-err'); const t = el.parentElement.querySelector('.err-t'); if (t) t.remove(); }
  save();
});
window.addEventListener('resize', () => { if (effView() !== lastEV) render(); else applyView(); });

load();
render();
</script>
